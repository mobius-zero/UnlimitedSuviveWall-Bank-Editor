
name: Build Windows EXE

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript
        run: npm run typecheck

      - name: Build offline web app
        run: npx vite build --base ./

      - name: Prepare Electron application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path desktop | Out-Null
          Copy-Item -Path dist -Destination desktop\dist -Recurse

          @'
          {
            "name": "unlimited-suvivewall-bank-editor-desktop",
            "version": "0.1.0",
            "description": "SC2 Bank Editor Desktop",
            "main": "main.cjs",
            "license": "MIT"
          }
          '@ | Set-Content -Path desktop\package.json -Encoding utf8

          @'
          const { app, BrowserWindow } = require('electron');
          const path = require('node:path');

          function createWindow() {
            const win = new BrowserWindow({
              width: 1200,
              height: 850,
              minWidth: 800,
              minHeight: 600,
              autoHideMenuBar: true,
              webPreferences: {
                nodeIntegration: false,
                contextIsolation: true,
                sandbox: true
              }
            });

            win.webContents.setWindowOpenHandler(() => ({
              action: 'deny'
            }));

            win.webContents.on('will-navigate', (event) => {
              event.preventDefault();
            });

            win.loadFile(path.join(__dirname, 'dist', 'index.html'));
          }

          app.whenReady().then(() => {
            createWindow();

            app.on('activate', () => {
              if (BrowserWindow.getAllWindows().length === 0) {
                createWindow();
              }
            });
          });

          app.on('window-all-closed', () => {
            if (process.platform !== 'darwin') {
              app.quit();
            }
          });
          '@ | Set-Content -Path desktop\main.cjs -Encoding utf8

      - name: Package portable EXE
        run: >
          npx --yes electron-builder@26.15.3
          --projectDir desktop
          --win portable
          --x64
          --config.electronVersion=44.8.0
          --config.directories.output=../release
          --publish never

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: SC2Bank-Editor-Windows-Portable
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30
